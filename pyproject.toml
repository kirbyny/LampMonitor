[project]
name = "lampmonitor"
version = "0.1.0"
description = "Watch panel indicator lamps through UniFi cameras and email when one goes dark."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.4",
]

[project.scripts]
lampmonitor = "lampmonitor.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lampmonitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
